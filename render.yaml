services:
  - type: web
    name: cyber-crypt
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Must stay stable across deploys — rotating this invalidates encrypted cloud saves.
      - key: CLOUD_SAVE_SECRET
        sync: false
      - key: APP_URL
        value: https://cyber-crypt.onrender.com
      # Neon Postgres — required so accounts survive Render redeploys (ephemeral disk).
      - key: DATABASE_URL
        sync: false
