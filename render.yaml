services:
  - type: web
    name: cyber-crypt
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLOUD_SAVE_SECRET
        generateValue: true
