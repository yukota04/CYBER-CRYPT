services:
  - type: web
    name: cyber-crypt
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLOUD_SAVE_SECRET
        generateValue: true
      - key: APP_URL
        value: https://cyber-crypt.onrender.com
